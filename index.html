<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Kharitonova — Graphic Designer &amp; Illustrator</title>

    <!-- Sets the theme attribute before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var stored = localStorage.getItem('maria-portfolio-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Meta Information -->
    <meta name="author" content="Maria Kharitonova" />
    <meta
      name="description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities inspired by Asian art movements."
    />
    <meta
      name="keywords"
      content="Maria Kharitonova, Graphic Designer, Illustrator, Illustration, Branding, Adobe Illustrator, Adobe Photoshop, Figma, Portfolio"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Social Media Open Graph -->
    <meta
      property="og:title"
      content="Maria Kharitonova — Graphic Designer & Illustrator"
    />
    <meta
      property="og:description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Maria Kharitonova — Graphic Designer & Illustrator"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities."
    />
    <meta name="twitter:image" content="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

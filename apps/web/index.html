<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Kharitonova — Graphic Designer &amp; Illustrator</title>

    <!-- Sets the theme attribute before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var stored = localStorage.getItem('maria-portfolio-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- The browser's default scroll restoration re-applies whatever scroll offset
         was recorded for this history entry on reload/back-forward nav — this is a
         one-page scroller, so landing anywhere but the very top defeats the intro.
         Runs as early as possible (before layout) and disables it going forward. -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>

    <!-- Boot-shell background/text, inlined so it paints before the app's own
         stylesheet or JS bundle have loaded — mirrors theme.scss's --app-background
         values for each theme (kept in sync manually; there's nothing to import
         from at this point in the document). -->
    <style>
      html[data-theme='dark'] {
        background: #0a0a0a;
        color: #f5f5f5;
      }
      html[data-theme='light'] {
        background: #faf9f5;
        color: #17171a;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Montserrat', system-ui, sans-serif;
        font-size: 14px;
        letter-spacing: 0.02em;
        opacity: 0.7;
      }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Meta Information -->
    <meta name="author" content="Maria Kharitonova" />
    <meta
      name="description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities inspired by Asian art movements."
    />
    <meta
      name="keywords"
      content="Maria Kharitonova, Graphic Designer, Illustrator, Illustration, Branding, Adobe Illustrator, Adobe Photoshop, Figma, Portfolio"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Social Media Open Graph -->
    <meta
      property="og:title"
      content="Maria Kharitonova — Graphic Designer & Illustrator"
    />
    <meta
      property="og:description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Maria Kharitonova — Graphic Designer & Illustrator"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Maria Kharitonova, a graphic designer and illustrator with 3+ years of experience creating posters, leaflets, illustrations, and brand identities."
    />
    <meta name="twitter:image" content="/icon.svg" />
  </head>
  <body>
    <div id="root">
      <!-- Replaced wholesale once React mounts (createRoot(...).render(...)) — this
           is only ever seen while the JS bundle is still downloading/parsing. -->
      <div id="boot-shell">
        <p>Loading experience&hellip; <span id="boot-timer">0%</span></p>
      </div>
    </div>
    <script>
      (function () {
        // There's no real byte-level progress signal for an ES module script, so
        // this climbs on an easing curve instead of ticking a raw clock — fast at
        // first, slowing as it approaches 100% (asymptotic, deliberately never
        // quite arriving on its own) so it always feels like it's progressing,
        // however long the actual load takes. main.tsx flips window.__bootDone and
        // writes a final "100%" itself right before mounting, so this loop stops
        // the instant that happens instead of racing it on the next frame.
        var start = performance.now();
        var TIME_CONSTANT_S = 1.2;
        function tick() {
          if (window.__bootDone) return;
          var el = document.getElementById('boot-timer');
          if (!el) return; // React has mounted and replaced #root's contents
          var elapsedS = (performance.now() - start) / 1000;
          var pct = 100 * (1 - Math.exp(-elapsedS / TIME_CONSTANT_S));
          el.textContent = Math.round(pct) + '%';
          requestAnimationFrame(tick);
        }
        tick();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
